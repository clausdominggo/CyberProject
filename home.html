<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RMF Steps</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col min-h-screen">
  <header class="bg-gray-800">
    <div class="flex justify-between items-center p-5">
      <h1 class="text-2xl">RMF STEPS</h1>
      <nav>
        <a href="step1.html" class="text-white hover:underline ml-5">Dashboard</a>
        <a href="#" class="text-white hover:underline ml-5">Contact Us</a>
        <a href="#" class="text-white hover:underline ml-5">About Us</a>
        <a href="#" class="text-white hover:underline ml-5">Steps Explanation</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow">
    <section class="p-10 text-center">
      <h2 class="text-4xl font-bold mb-6">Cyber Risk Dashboard</h2>
      <p class="text-xl mb-10">Overall Risk Level: <span class="text-red-500 font-bold text-4xl">72%</span></p>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
        <div><canvas id="pieChart"></canvas></div>
        <div><canvas id="barChart"></canvas></div>
        <div><canvas id="lineChart"></canvas></div>
        <div><canvas id="radarChart"></canvas></div>
        <div><canvas id="doughnutChart"></canvas></div>
        <div><canvas id="polarChart"></canvas></div>
      </div>
    </section>
  </main>

  <footer class="bg-gray-800 p-10 mt-auto">
    <div class="text-center">
      <h3 class="text-2xl mb-5">Stay Connected</h3>
      <p class="mb-5">Follow us on social media for the latest updates and news.</p>
      <div class="flex justify-center mb-5">
        <a href="#" class="text-white mx-3 hover:underline">Facebook</a>
        <a href="#" class="text-white mx-3 hover:underline">Twitter</a>
        <a href="#" class="text-white mx-3 hover:underline">LinkedIn</a>
        <a href="#" class="text-white mx-3 hover:underline">Instagram</a>
      </div>
      <p class="mb-5">© 2023 RMF Steps. All rights reserved.</p>
      <p>Contact: <a href="mailto:kelompok2@gmail.com" class="text-purple-500 hover:underline">kelompok2@gmail.com</a></p>
    </div>
  </footer>

  <script>
    // Pie Chart
    new Chart(document.getElementById('pieChart'), {
      type: 'pie',
      data: {
        labels: ['Phishing', 'Malware', 'DDoS', 'Insider Threat'],
        datasets: [{
          data: [30, 25, 20, 25],
          backgroundColor: ['#ec4899', '#8b5cf6', '#10b981', '#f59e0b']
        }]
      }
    });

    // Bar Chart
    new Chart(document.getElementById('barChart'), {
      type: 'bar',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr'],
        datasets: [{
          label: 'Reported Incidents',
          data: [12, 19, 8, 15],
          backgroundColor: '#6366f1'
        }]
      },
      options: {
        scales: { y: { beginAtZero: true } }
      }
    });

    // Line Chart
    new Chart(document.getElementById('lineChart'), {
      type: 'line',
      data: {
        labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
        datasets: [{
          label: 'Attack Attempts',
          data: [5, 9, 6, 12],
          fill: false,
          borderColor: '#f87171',
          tension: 0.1
        }]
      }
    });

    // Radar Chart
    new Chart(document.getElementById('radarChart'), {
      type: 'radar',
      data: {
        labels: ['Firewalls', 'Encryption', 'Monitoring', 'Training', 'Incident Response'],
        datasets: [{
          label: 'Security Capabilities',
          data: [70, 80, 60, 65, 75],
          backgroundColor: 'rgba(139, 92, 246, 0.2)',
          borderColor: '#8b5cf6'
        }]
      }
    });

    // Doughnut Chart
    new Chart(document.getElementById('doughnutChart'), {
      type: 'doughnut',
      data: {
        labels: ['Hardware', 'Software', 'Training', 'Backup'],
        datasets: [{
          data: [25, 35, 20, 20],
          backgroundColor: ['#10b981', '#6366f1', '#f59e0b', '#ec4899']
        }]
      }
    });

    // Polar Area Chart
    new Chart(document.getElementById('polarChart'), {
      type: 'polarArea',
      data: {
        labels: ['Finance', 'HR', 'IT', 'R&D', 'Sales'],
        datasets: [{
          data: [65, 59, 80, 81, 56],
          backgroundColor: ['#f87171', '#60a5fa', '#34d399', '#fbbf24', '#a78bfa']
        }]
      }
    });
  </script>
</body>
</html>
